<!doctype html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gedeelde woordenlijst</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f4f3ef}*{box-sizing:border-box}body{margin:0}.shell{width:min(760px,calc(100% - 32px));margin:auto;padding:70px 0 50px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#7a746b;margin-bottom:14px}.hero{margin-bottom:30px}.hero h1{font-size:46px;line-height:1.02;letter-spacing:-.045em;margin:0 0 16px}.hero h1 span{color:#77736c}.hero p{font-size:17px;line-height:1.55;color:#68645e;margin:0}.card{background:#fff;border:1px solid #e3e0d9;border-radius:18px;box-shadow:0 8px 30px rgba(28,24,16,.04)}.add{padding:22px;margin-bottom:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}.row{display:flex;gap:10px}input{font:inherit}.row input{min-width:0;flex:1;border:1px solid #d8d5ce;border-radius:11px;padding:14px 15px;font-size:16px;outline:0}.row input:focus,.search input:focus{border-color:#777;box-shadow:0 0 0 3px rgba(80,75,65,.08)}button{border:0;border-radius:11px;padding:0 22px;background:#171717;color:#fff;font-weight:750;font-size:14px;cursor:pointer}button:disabled{opacity:.6}.message{min-height:20px;padding-top:9px;font-size:13px}.success{color:#24724b}.warning{color:#9a6900}.error{color:#a33b3b}.head{display:flex;justify-content:space-between;padding:12px 3px 11px;color:#77736c;font-size:13px}.head strong{color:#171717}.live{display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#4a9b68}.list{overflow:hidden}.search{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid #ece9e3}.search b{font-size:24px;color:#8a857d}.search input{width:100%;border:0;outline:0;font-size:15px}.words{max-height:520px;overflow:auto}.word{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #efede8;font-size:15px}.word small{color:#aaa59c;font-size:11px}.empty{padding:55px 20px;text-align:center;color:#99938a}footer{text-align:center;color:#9a958d;font-size:12px;padding:20px 10px;line-height:1.5}@media(max-width:560px){.shell{padding-top:40px}.hero h1{font-size:37px}.row{flex-direction:column}.row button{height:48px}}
</style></head><body><main class="shell"><header class="hero"><div class="eyebrow">GEDEELDE WOORDENLIJST</div><h1>Voeg woorden toe.<br><span>Voorkom dubbele woorden.</span></h1><p>Iedereen kan woorden toevoegen. De app controleert automatisch of een woord al bestaat.</p></header><section class="card add"><form id="form"><label for="word">Nieuw woord</label><div class="row"><input id="word" autocomplete="off" maxlength="100" placeholder="Bijv. olifant"><button>Toevoegen</button></div><div id="msg" class="message"></div></form></section><section class="head"><div><strong id="count">0</strong> woorden</div><div class="live"><i class="dot"></i><span id="mode">Demo-modus</span></div></section><section class="card list"><div class="search"><b>⌕</b><input id="search" placeholder="Zoek in de woordenlijst…"></div><div id="words" class="words"></div></section><footer id="footer">Dit is een lokale demo. Configureer Supabase voor een gedeelde online lijst.</footer></main><script type="module">
const SUPABASE_URL='https://ajafjpwrgdllqpqfpskx.supabase.co';const SUPABASE_KEY='sb_publishable_m2KtSU2omfEEAvGfYtgwgA_CUFN-rGK';
let sb=null;let words=[];let filter='';const KEY='woordenlijst-demo';
const norm=s=>s.trim().toLocaleLowerCase('nl-NL').replace(/\s+/g,' ');const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadSupabase(){if(!SUPABASE_URL||!SUPABASE_KEY)return false;const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=m.createClient(SUPABASE_URL,SUPABASE_KEY);return true}
function render(){let shown=[...words].sort((a,b)=>a.word.localeCompare(b.word,'nl-NL')).filter(x=>!filter||x.word.includes(filter));document.querySelector('#count').textContent=words.length;document.querySelector('#words').innerHTML=shown.length?shown.map((x,i)=>`<div class="word"><span>${esc(x.word)}</span><small>#${i+1}</small></div>`).join(''):`<div class="empty">${filter?'Geen woorden gevonden.':'Nog geen woorden toegevoegd.'}</div>`}
function msg(t,c=''){const e=document.querySelector('#msg');e.textContent=t;e.className='message '+c}
function save(){localStorage.setItem(KEY,JSON.stringify(words))}
async function add(e){e.preventDefault();const input=document.querySelector('#word'),word=norm(input.value);if(!word)return msg('Vul eerst een woord in.','error');if(words.some(x=>x.word===word))return msg(`“${word}” staat al in de lijst.`,'warning');e.target.querySelector('button').disabled=true;try{if(sb){const {data,error}=await sb.from('words').insert({word}).select().single();if(error){if(error.code==='23505')throw Error('DUP');throw error}words.push(data)}else{words.push({id:crypto.randomUUID(),word});save()}render();msg(`“${word}” is toegevoegd.`,'success');input.value='';input.focus()}catch(x){msg(x.message==='DUP'?'Dit woord is zojuist al door iemand anders toegevoegd.':'Toevoegen is niet gelukt.','error')}finally{e.target.querySelector('button').disabled=false}}
document.querySelector('#form').addEventListener('submit',add);document.querySelector('#search').addEventListener('input',e=>{filter=norm(e.target.value);render()});
(async()=>{let online=false;try{online=await loadSupabase()}catch{}if(sb){const {data,error}=await sb.from('words').select('id,word').order('word');if(!error){words=data||[];document.querySelector('#mode').textContent='Live gedeeld';document.querySelector('#footer').textContent='Wijzigingen worden automatisch gedeeld met iedereen die deze app gebruikt.';render()}sb.channel('words-live').on('postgres_changes',{event:'*',schema:'public',table:'words'},p=>{if(p.eventType==='INSERT'&&!words.some(w=>w.id===p.new.id))words.push(p.new);if(p.eventType==='DELETE')words=words.filter(w=>w.id!==p.old.id);if(p.eventType==='UPDATE')words=words.map(w=>w.id===p.new.id?p.new:w);render()}).subscribe()}else{try{words=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}render()}})();
</script></body></html>
